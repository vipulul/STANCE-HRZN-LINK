# STANCE // HRZN-LINK — Single-Port (8080) Docker Compose Definition

services:
  stance-hrzn-link:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stance-hrzn-link
    restart: unless-stopped
    ports:
      - "8080:8080" # Vue 3 Web UI, HTTP Config API, /ws/device (HRZN-01), and /ws/ui
    volumes:
      - ./data:/app/data # Persistent HRZN-01 servo calibration & HUD layout settings
      - ./plugins:/app/plugins # Drop-in runtime HUD plugins directory
    environment:
      - TZ=UTC
      - HRZN_PORT=8080
      - HRZN_DATA_DIR=/app/data
